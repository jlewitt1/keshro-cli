[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keshro"
version = "0.1.0"
description = "Keshro CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "httpx-sse>=0.4",
    "typer>=0.9",
    "rich>=13.0",
    "textual>=0.80",
]

[project.scripts]
keshro = "keshro_cli.cli:main"
kr = "keshro_cli.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/keshro_cli"]
